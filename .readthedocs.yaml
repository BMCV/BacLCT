version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # Qt libraries PyQt6 dlopens when baclct.napari imports qtpy
  apt_packages:
    - libegl1
    - libgl1
    - libglib2.0-0
    - libdbus-1-3
    - libxkbcommon-x11-0
  jobs:
    post_create_environment:
      - python -m pip install --upgrade pip # pip >= 25.1 for --group
    # the default index serves the CUDA build of torch, which does not fit the builder
    pre_install:
      - python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    post_install:
      - python -m pip install --group docs

# autodoc imports baclct, so the docs build installs the full runtime stack
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - train
        - napari

sphinx:
  configuration: docs/conf.py
