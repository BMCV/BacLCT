defaults:
  - node_model: ???
  - node_encoder: ???

_target_: baclct.models.model.MPModel
_convert_: all

num_layers: 4
reattach_initial_nodes: true
reattach_initial_edges: true

hidden_node_dim: 64
hidden_edge_dim: 64

dropout: 0.0
act: leaky_relu
norm: batch_norm

edge_encoder:
  _target_: torch_geometric.nn.MLP
  channel_list:
    [
      -1,
      "${div:${model.graph_model.hidden_edge_dim}, 4}",
      "${div:${model.graph_model.hidden_edge_dim}, 2}",
      "${model.graph_model.hidden_edge_dim}",
    ]
  plain_last: false
  dropout: ${model.graph_model.dropout}
  act: ${model.graph_model.act}
  norm: ${model.graph_model.norm}

edge_model:
  _target_: baclct.models.model.EdgeModel
  edge_mlp:
    _target_: torch_geometric.nn.MLP
    channel_list:
      [
        -1,
        "${mul:${model.graph_model.hidden_edge_dim}, 2}",
        "${model.graph_model.hidden_edge_dim}",
      ]
    plain_last: false
    dropout: ${model.graph_model.dropout}
    act: ${model.graph_model.act}
    norm: ${model.graph_model.norm}

edge_classifier:
  _target_: torch_geometric.nn.MLP
  channel_list: [-1, "${div:${model.graph_model.hidden_edge_dim}, 2}", 3]
  dropout: ${model.graph_model.dropout}
  act: ${model.graph_model.act}
  norm: ${model.graph_model.norm}

# default: will be automatically removed when setting task
node_classifier:
  _target_: torch_geometric.nn.MLP
  channel_list: [-1, "${div:${model.graph_model.hidden_node_dim}, 2}", 3]
  dropout: ${model.graph_model.dropout}
  act: ${model.graph_model.act}
  norm: ${model.graph_model.norm}

aggregate_outputs: true

similarity_func:
  _target_: torch.nn.CosineSimilarity
  dim: 1
similarity_input: ${default_similarity_input:${features.edges.feature_names}}
