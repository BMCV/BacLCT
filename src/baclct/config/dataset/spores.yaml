# @package _global_

defaults:
  - override /model/graph_model/node_model: _base

data:
  precompute_edges: true
  segmentation_name: GT
  data_format: ctc
  img_name: null

  graph_search_radius: 180
  graph_time_step: 1
  graph_num_steps: 3
  graph_edge_dropout: 0.0
  graph_node_dropout: 0.3
  graph_frame_dropout: 0.1

  batch_size: 16
  batch_size_val: 1

  use_patches: false

  sampling_alpha: 0.5
  sampling_floor: 0.05 # higher floor since low number of seqs
  sampling_size_measure: cells # some long sequences have only few cells

features:
  edges:
    prune_edges_by: [dilated_overlap, thickness]

hidden_dim: 128
model:
  graph_model:
    hidden_node_dim: ${hidden_dim}
    hidden_edge_dim: ${hidden_dim}
    dropout: 0.3

# model overfits quite fast, so we limit training time
trainer:
  limit_train_batches: 50
  max_epochs: 360

  devices: 1

dataset_name: spores

num_edge_classes: 3
num_node_classes: 3
