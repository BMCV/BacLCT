# @package _global_

# Example dataset config. Copy, adjust, and train with:
#   baclct-train --config-dir examples/configs dataset=mydata task=tracking fold=0
# Data is read from `paths.data_dir` (./data/mydata by default) in CTC format.

data:
  segmentation_name: GT # subdirectory holding the segmentation masks
  data_format: ctc
  precompute_edges: true

  # largest displacement between two consecutive frames, in px or relative to cell size
  graph_search_radius: 2x
  graph_num_steps: 3

  batch_size: 1
  num_workers: 8
  num_workers_val: 8

  # tile large fields of view instead of building one whole-frame graph
  use_patches: false
  patch_size: 128
  patch_overlap: 0.25

features:
  edges:
    # 'ellipse' emphasizes movement along the long axis of rod-shaped cells, `null` keeps
    # the search radius as the only limit
    prune_edges_by: ellipse

hidden_dim: 128
model:
  lr: 3e-4
  graph_model:
    num_layers: 4 # message passing steps
    hidden_node_dim: ${hidden_dim}
    hidden_edge_dim: ${hidden_dim}
    dropout: 0.1

trainer:
  max_epochs: 360

dataset_name: mydata

num_edge_classes: 3
num_node_classes: null # number of life cycle states, or null for tracking only
